import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'main.werewolfkotlin'
    compileSdk 37

    defaultConfig {
        applicationId "main.werewolfkotlin"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    // JSON : one library for the whole application (roles file, saved game)
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0'
    // org.json is used by the small preferences stores. It is part of Android,
    // this dependency only brings it to the unit tests running on the computer.
    implementation 'org.json:json:20260814'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    // Material Design
    implementation 'com.google.android.material:material:1.14.0'

    // Unit tests : the model and the rules of the game run on the computer, without Android
    testImplementation 'junit:junit:4.13.2'

    // Instrumentation tests
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}